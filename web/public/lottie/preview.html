<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Lottie 动画库 — VST 项目素材</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f1a; color: #e0e0e0; font-family: -apple-system, 'PingFang SC', sans-serif; padding: 24px; }
    h1 { text-align: center; margin-bottom: 8px; font-size: 28px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { text-align: center; color: #666; margin-bottom: 32px; font-size: 14px; }
    .section { margin-bottom: 32px; }
    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; padding-left: 12px; border-left: 3px solid #667eea; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card {
      background: #1a1a2e; border-radius: 12px; padding: 16px;
      display: flex; flex-direction: column; align-items: center;
      transition: all 0.2s; border: 1px solid #2a2a3e;
    }
    .card:hover { transform: translateY(-4px); border-color: #667eea; box-shadow: 0 8px 24px rgba(102,126,234,0.15); }
    .anim-box {
      width: 180px; height: 180px; background: #16162a; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
      overflow: hidden;
    }
    .anim-box svg, .anim-box canvas { max-width: 100%; max-height: 100%; }
    .name { font-size: 14px; font-weight: 600; margin-bottom: 4px; color: #fff; }
    .meta { font-size: 11px; color: #666; margin-bottom: 8px; }
    .controls { display: flex; gap: 6px; }
    .controls button {
      background: #2a2a3e; color: #aaa; border: 1px solid #3a3a4e; padding: 4px 12px;
      border-radius: 6px; cursor: pointer; font-size: 11px; transition: all 0.15s;
    }
    .controls button:hover { background: #667eea; color: #fff; border-color: #667eea; }
    .tag { display: inline-block; background: #667eea22; color: #667eea; padding: 2px 8px; border-radius: 4px; font-size: 10px; margin-bottom: 4px; }
    .status { font-size: 10px; color: #4ecdc4; margin-top: 4px; }
    .error { color: #e94560; }
  </style>
</head>
<body>
  <h1>Lottie 动画库</h1>
  <p class="subtitle">VST 项目素材 · 21 个动画 · 点击播放/暂停/重播</p>
  <div id="content"></div>

  <script>
    const files = [
      // UI 反馈
      { file: "checkmark", label: "打勾确认", cat: "UI 反馈", catColor: "#4ecdc4", tags: ["支付","确认"] },
      { file: "success_check", label: "成功 ✓", cat: "UI 反馈", catColor: "#4ecdc4", tags: ["完成","支付"] },
      { file: "loading_spinner", label: "加载动画", cat: "UI 反馈", catColor: "#4ecdc4", tags: ["loading","等待"] },
      { file: "gradient_spinner", label: "渐变加载", cat: "UI 反馈", catColor: "#4ecdc4", tags: ["loading","渐变"] },
      { file: "bounce_ball", label: "弹跳球", cat: "UI 反馈", catColor: "#4ecdc4", tags: ["loading","趣味"] },
      // 社交互动
      { file: "heart_pop", label: "爱心弹出", cat: "社交互动", catColor: "#ff6b6b", tags: ["点赞","收藏"] },
      { file: "pulse_heart", label: "脉冲爱心", cat: "社交互动", catColor: "#ff6b6b", tags: ["心跳","喜欢"] },
      { file: "thumbs_up", label: "竖拇指", cat: "社交互动", catColor: "#ff6b6b", tags: ["点赞","好评"] },
      { file: "trophy", label: "奖杯", cat: "社交互动", catColor: "#ff6b6b", tags: ["成就","第一"] },
      // 特效装饰
      { file: "confetti_burst", label: "彩带爆发", cat: "特效装饰", catColor: "#ffd93d", tags: ["庆祝","活动"] },
      { file: "star_burst", label: "星星爆发", cat: "特效装饰", catColor: "#ffd93d", tags: ["推荐","闪亮"] },
      { file: "lightning_bolt", label: "闪电", cat: "特效装饰", catColor: "#ffd93d", tags: ["限时","快速"] },
      { file: "particle_explosion", label: "粒子爆炸", cat: "特效装饰", catColor: "#ffd93d", tags: ["特效","冲击"] },
      { file: "ripple", label: "波纹扩散", cat: "特效装饰", catColor: "#ffd93d", tags: ["涟漪","水波"] },
      { file: "wave_line", label: "波浪线", cat: "特效装饰", catColor: "#ffd93d", tags: ["音波","动态"] },
      // 品牌/趣味
      { file: "morphing_blob", label: "变形 blob", cat: "品牌/趣味", catColor: "#a29bfe", tags: ["抽象","流动"] },
      { file: "adrock", label: "Adrock", cat: "品牌/趣味", catColor: "#a29bfe", tags: ["品牌","摇滚"] },
      { file: "gatin_cat", label: "小猫", cat: "品牌/趣味", catColor: "#a29bfe", tags: ["萌宠","趣味"] },
      { file: "bodymovin_logo", label: "Bodymovin Logo", cat: "品牌/趣味", catColor: "#a29bfe", tags: ["品牌","lottie"] },
      { file: "happy_2016", label: "新年快乐", cat: "品牌/趣味", catColor: "#a29bfe", tags: ["节日","庆祝"] },
      { file: "navidad", label: "圣诞节", cat: "品牌/趣味", catColor: "#a29bfe", tags: ["节日","圣诞"] },
    ];

    // Group by category
    const groups = {};
    files.forEach(f => {
      if (!groups[f.cat]) groups[f.cat] = { color: f.catColor, items: [] };
      groups[f.cat].items.push(f);
    });

    const content = document.getElementById('content');
    const anims = {};
    let idx = 0;

    Object.entries(groups).forEach(([catName, cat]) => {
      const section = document.createElement('div');
      section.className = 'section';
      section.innerHTML = `<div class="section-title" style="border-color:${cat.color}">${catName}</div>`;
      const grid = document.createElement('div');
      grid.className = 'grid';

      cat.items.forEach((item) => {
        const i = idx++;
        const card = document.createElement('div');
        card.className = 'card';
        const tagsHtml = item.tags.map(t => `<span class="tag">${t}</span>`).join(' ');
        card.innerHTML = `
          <div class="anim-box" id="a${i}"></div>
          <div class="name">${item.label}</div>
          <div class="meta">${item.file}.json</div>
          <div>${tagsHtml}</div>
          <div class="controls">
            <button onclick="P(${i})">播放</button>
            <button onclick="U(${i})">暂停</button>
            <button onclick="R(${i})">重播</button>
          </div>
          <div class="status" id="s${i}">加载中...</div>
        `;
        grid.appendChild(card);

        // Load via XHR (more reliable than fetch for local files)
        const xhr = new XMLHttpRequest();
        xhr.open('GET', `${item.file}.json`, true);
        xhr.onload = function() {
          if (xhr.status === 200) {
            try {
              const data = JSON.parse(xhr.responseText);
              if (data.layers && data.layers.length > 0) {
                // Dynamic import lottie-web
                const script = document.createElement('script');
                script.src = 'lottie.min.js';
                script.onload = () => {
                  try {
                    anims[i] = lottie.loadAnimation({
                      container: document.getElementById(`a${i}`),
                      renderer: 'svg',
                      loop: true,
                      autoplay: false,
                      animationData: data,
                    });
                    document.getElementById(`s${i}`).textContent = `${data.w}×${data.h} · ${Math.round(data.op)}帧 · ${data.layers.length}层`;
                  } catch(e) {
                    document.getElementById(`s${i}`).innerHTML = `<span class="error">渲染失败: ${e.message}</span>`;
                  }
                };
                if (!window.lottie) {
                  document.head.appendChild(script);
                } else {
                  script.onload();
                }
              } else {
                document.getElementById(`s${i}`).innerHTML = '<span class="error">无动画数据</span>';
              }
            } catch(e) {
              document.getElementById(`s${i}`).innerHTML = `<span class="error">JSON 解析失败</span>`;
            }
          } else {
            document.getElementById(`s${i}`).innerHTML = `<span class="error">HTTP ${xhr.status}</span>`;
          }
        };
        xhr.onerror = function() {
          document.getElementById(`s${i}`).innerHTML = '<span class="error">网络错误</span>';
        };
        xhr.send();
      });

      section.appendChild(grid);
      content.appendChild(section);
    });

    function P(i) { anims[i]?.play(); }
    function U(i) { anims[i]?.pause(); }
    function R(i) { anims[i]?.stop(); anims[i]?.play(); }
  </script>
</body>
</html>
