services:
  python:
    build:
      context: .
      dockerfile: services/python/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_IMAGE_MODEL=${GEMINI_IMAGE_MODEL:-gemini-3-pro-image-preview}
      - MIMO_API_URL=${MIMO_API_URL:-https://token-plan-cn.xiaomimimo.com/v1/chat/completions}
      - MIMO_API_KEY=${MIMO_API_KEY:-}
      - MIMO_MODEL=${MIMO_MODEL:-mimo-v2.5-pro}
      - MIMO_VLM_MODEL=${MIMO_VLM_MODEL:-mimo-v2.5}
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/health'); r.raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  node:
    build:
      context: .
      dockerfile: services/node/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHON_URL=http://python:8000
      - PROJECT_ROOT=/app
    depends_on:
      python:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - node

  # One-off: seed the knowledge base
  # Usage: docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: services/python/Dockerfile
    volumes:
      - ./data:/app/data
    entrypoint: ["python", "scripts/seed_kb.py"]
    profiles: ["seed"]
